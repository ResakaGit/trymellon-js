name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Require NPM_TOKEN for publish
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repo Settings > Secrets and variables > Actions (repository secret). Use an npm Automation token or Granular token with Read and write packages for @trymellon scope."
            exit 1
          fi
          echo "NPM_TOKEN is set (value is masked in logs)."
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@trymellon'

      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Borrar tag v1.7.7 si existe (evita "tag already exists" cuando la versión calculada salta a 2.0.0 y el tag viejo queda huérfano).
      - name: Remove orphan tag v1.7.7
        run: git push origin --delete v1.7.7 2>/dev/null || true

      # semantic-release publica a npm cuando hay commits que generan release (feat:, fix:, etc.).
      # También con chore(release): o release: (patch). Requiere NPM_TOKEN en Secrets.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npx semantic-release
