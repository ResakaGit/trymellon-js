name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: eifinger/actionlint-action@v1

  typecheck-and-test:
    name: Type Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi
      - run: npm ci
      - run: npm run audit:ci

  test-angular:
    name: Test Angular adapter
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi
      - run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run Angular adapter tests
        run: npx vitest run --config vitest.angular.config.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi
      - run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e

  build:
    name: Build
    needs: [lint, typecheck-and-test, security-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Check lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install', commit the file, and push."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Check build artifacts
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.global.js
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/react.js
          test -f dist/vue.js
          test -f dist/angular.js
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
